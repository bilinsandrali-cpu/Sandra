<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫剧有数 - 热度日报汇总</title>
<style>
  :root {
    --douyin-primary: #5B2D8E;
    --douyin-gradient: linear-gradient(135deg, #5B2D8E 0%, #8B5CF6 50%, #EC4899 100%);
    --hongguo-primary: #E8652D;
    --hongguo-gradient: linear-gradient(135deg, #E8652D 0%, #F59E0B 100%);
    --bg: #0f0f1a;
    --card-bg: #1a1a2e;
    --text: #e0e0e0;
    --text-muted: #888;
    --border: #2a2a3e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 20px 32px 0;
    border-bottom: none;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .top-tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
  }

  .top-tab {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.5px;
  }

  .top-tab:hover {
    color: var(--text);
  }

  .top-tab::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: transparent;
    transition: background 0.2s;
  }

  .top-tab.active-douyin {
    color: #A78BFA;
  }

  .top-tab.active-douyin::after {
    background: var(--douyin-gradient);
  }

  .top-tab.active-hongguo {
    color: #FBBF24;
  }

  .top-tab.active-hongguo::after {
    background: var(--hongguo-gradient);
  }

  .date-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    background: rgba(26, 26, 46, 0.6);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .date-bar-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .date-selector {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-selector input[type="date"] {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .date-nav-btn {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .date-nav-btn:hover {
    background: #3a3a5e;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    color: white;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  .btn-secondary {
    background: #2a2a3e;
    color: var(--text);
    border: 1px solid #3a3a4e;
  }

  .btn-secondary:hover { background: #3a3a5e; }

  .btn-export {
    background: linear-gradient(135deg, #059669, #10B981);
    color: white;
  }

  .btn-export:hover { opacity: 0.9; }

  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: #1e1e32;
    border: 1px solid #3a3a4e;
    border-radius: 10px;
    min-width: 200px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 6px;
    animation: dropIn 0.15s ease-out;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-menu.show { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .dropdown-item:hover {
    background: rgba(139, 92, 246, 0.15);
    color: #A78BFA;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 8px;
  }

  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  .table-container {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .table-header-bar {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .table-title {
    font-size: 18px;
    font-weight: 700;
  }

  .table-title.douyin { color: #8B5CF6; }
  .table-title.hongguo { color: #F59E0B; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 14px 16px;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  tbody tr:hover {
    background: rgba(255,255,255,0.03);
  }

  .rank-cell {
    font-weight: 700;
    font-size: 16px;
    width: 50px;
    text-align: center;
  }

  .rank-1 { color: #FFD700; }
  .rank-2 { color: #C0C0C0; }
  .rank-3 { color: #CD7F32; }

  .rank-medal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
  }

  .medal-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
  .medal-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: #000; }
  .medal-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }

  .drama-name {
    font-weight: 600;
    color: #fff;
    max-width: 220px;
    cursor: pointer;
    position: relative;
  }

  .drama-name:hover { color: #A78BFA; }

  .drama-name .synopsis-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(139,92,246,0.2);
    color: #A78BFA;
    font-size: 10px;
    text-align: center;
    line-height: 16px;
    margin-left: 4px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .synopsis-row td {
    padding: 0 !important;
    border-bottom: 1px solid rgba(139,92,246,0.1) !important;
  }

  .synopsis-content {
    padding: 12px 20px 12px 76px;
    font-size: 13px;
    line-height: 1.7;
    color: #aaa;
    background: rgba(139,92,246,0.04);
    border-left: 3px solid rgba(139,92,246,0.3);
    margin: 0;
    animation: synopsisFadeIn 0.2s ease-out;
  }

  .synopsis-content strong {
    color: #A78BFA;
    font-size: 12px;
    margin-right: 6px;
  }

  @keyframes synopsisFadeIn {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 200px; }
  }

  .highlight-value {
    font-weight: 700;
  }

  .highlight-value.douyin { color: #8B5CF6; }
  .highlight-value.hongguo { color: #F59E0B; }

  .type-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    background: rgba(139, 92, 246, 0.15);
    color: #A78BFA;
  }

  .type-tag.hongguo {
    background: rgba(245, 158, 11, 0.15);
    color: #FBBF24;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px;
    max-width: 900px;
    width: 95%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--border);
  }

  .modal h2 {
    font-size: 20px;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .form-group select,
  .form-group input,
  .form-group textarea {
    width: 100%;
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }

  .form-group textarea {
    height: 300px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .paste-hint {
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #A78BFA;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .no-data-icon { font-size: 48px; margin-bottom: 16px; }
  .no-data-text { font-size: 16px; }

  .available-dates {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .date-chip {
    padding: 6px 14px;
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-muted);
  }

  .date-chip:hover { border-color: #8B5CF6; color: #8B5CF6; }
  .date-chip.active { background: #8B5CF6; border-color: #8B5CF6; color: white; }
  .date-chip.active-hongguo { background: var(--hongguo-primary); border-color: var(--hongguo-primary); color: white; }
  .date-chip.active-hongguo:hover { border-color: var(--hongguo-primary); color: white; }

  /* Copilot 样式 */
  .copilot-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(139,92,246,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 900;
    transition: all 0.3s;
    animation: copilotPulse 2s ease-in-out infinite;
  }

  .copilot-fab:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(139,92,246,0.6);
  }

  .copilot-fab svg { width: 26px; height: 26px; fill: white; }

  @keyframes copilotPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(139,92,246,0.4); }
    50% { box-shadow: 0 4px 28px rgba(236,72,153,0.5); }
  }

  .copilot-panel {
    position: fixed;
    top: 0; right: -420px; bottom: 0;
    width: 420px;
    background: #12121f;
    border-left: 1px solid #2a2a3e;
    z-index: 950;
    display: flex;
    flex-direction: column;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -8px 0 32px rgba(0,0,0,0.5);
  }

  .copilot-panel.open { right: 0; }

  .copilot-header {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2a2a3e;
    background: rgba(26,26,46,0.8);
    backdrop-filter: blur(12px);
  }

  .copilot-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .copilot-header-icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    display: flex; align-items: center; justify-content: center;
  }

  .copilot-header-icon svg { width: 18px; height: 18px; fill: white; }

  .copilot-header-title {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, #A78BFA, #F472B6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .copilot-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 20px; padding: 4px 8px;
    border-radius: 6px; transition: all 0.2s;
  }

  .copilot-close:hover { background: rgba(255,255,255,0.08); color: white; }

  .copilot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .copilot-msg {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.7;
    word-break: break-word;
    animation: msgFadeIn 0.25s ease-out;
  }

  @keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .copilot-msg.bot {
    background: #1e1e32;
    border: 1px solid #2a2a3e;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .copilot-msg.user {
    background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.15));
    border: 1px solid rgba(139,92,246,0.3);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    color: #e8e0ff;
  }

  .copilot-msg strong { color: #A78BFA; }
  .copilot-msg .highlight { color: #FBBF24; font-weight: 600; }
  .copilot-msg .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; background: rgba(139,92,246,0.15); color: #A78BFA; margin: 1px 2px; }
  .copilot-msg .num { color: #34D399; font-weight: 600; }

  .copilot-suggestions {
    padding: 0 16px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .copilot-suggest-btn {
    padding: 6px 12px;
    border-radius: 18px;
    border: 1px solid #3a3a4e;
    background: rgba(42,42,62,0.6);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .copilot-suggest-btn:hover {
    border-color: #8B5CF6;
    color: #A78BFA;
    background: rgba(139,92,246,0.1);
  }

  .copilot-input-area {
    padding: 14px 16px;
    border-top: 1px solid #2a2a3e;
    display: flex;
    gap: 10px;
    background: rgba(26,26,46,0.8);
    backdrop-filter: blur(12px);
  }

  .copilot-input {
    flex: 1;
    background: #1e1e32;
    border: 1px solid #3a3a4e;
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 13.5px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .copilot-input:focus { border-color: #8B5CF6; }

  .copilot-input::placeholder { color: #555; }

  .copilot-send {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .copilot-send:hover { transform: scale(1.08); }
  .copilot-send svg { width: 18px; height: 18px; fill: white; }

  .copilot-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    z-index: 940;
  }

  .copilot-overlay.show { display: block; }

  .copilot-typing {
    display: flex; gap: 4px; padding: 4px 0;
  }

  .copilot-typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #8B5CF6;
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .copilot-typing span:nth-child(2) { animation-delay: 0.15s; }
  .copilot-typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  @media (max-width: 768px) {
    .header { padding: 16px; }
    .main { padding: 16px; }
    .table-container { overflow-x: auto; }
    table { min-width: 700px; }
    .copilot-panel { width: 100%; right: -100%; }
    .copilot-fab { bottom: 20px; right: 20px; width: 50px; height: 50px; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3a4e; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #5a5a6e; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div>
        <div class="logo">M 漫剧有数</div>
        <div class="subtitle">漫剧热度日报汇总系统</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="showAddModal()">＋ 录入数据</button>
      <div class="dropdown">
        <button class="btn btn-export" onclick="toggleDropdown()">↓ 导出 ▾</button>
        <div class="dropdown-menu" id="exportDropdown">
          <div class="dropdown-item" onclick="exportCurrentCSV()">📄 当前榜单 → CSV</div>
          <div class="dropdown-item" onclick="exportAllCSV()">📄 全部数据 → CSV</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" onclick="exportExcel()">📊 全部数据 → Excel</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" onclick="exportData()">🗂️ 原始数据 → JSON</div>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="importData()">↑ 导入JSON</button>
    </div>
  </div>
  <div class="top-tabs">
    <button class="top-tab active-douyin" id="tabDouyin" onclick="switchTab('douyin')">🎵 抖音漫剧热播榜</button>
    <button class="top-tab" id="tabHongguo" onclick="switchTab('hongguo')">🍎 红果漫剧热播榜</button>
  </div>
</div>

<div class="date-bar">
  <div class="date-bar-label">📅 日期筛选</div>
  <div class="date-selector">
    <button class="date-nav-btn" onclick="navigateDate(-1)">◀</button>
    <input type="date" id="dateInput" onchange="loadDate(this.value)">
    <button class="date-nav-btn" onclick="navigateDate(1)">▶</button>
  </div>
  <div class="available-dates" id="dateChips"></div>
</div>

<div class="main">
  <div class="table-container" id="douyinTable">
    <div class="table-header-bar">
      <div class="table-title douyin">📊 日榜 | 抖音漫剧热播榜</div>
      <div style="font-size:13px;color:var(--text-muted)" id="douyinDateLabel"></div>
    </div>
    <div id="douyinContent"></div>
  </div>
  <div class="table-container" id="hongguoTable" style="display:none">
    <div class="table-header-bar">
      <div class="table-title hongguo">📊 日榜 | 红果漫剧热播榜</div>
      <div style="font-size:13px;color:var(--text-muted)" id="hongguoDateLabel"></div>
    </div>
    <div id="hongguoContent"></div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>📝 录入榜单数据</h2>

function loadAllData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch(e) {}
  }
  const defaultData = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
  return defaultData;
}

function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let allData = loadAllData();
let currentDate = '';
let currentTab = 'douyin';

function getAvailableDates() {
  return Object.keys(allData).sort().reverse();
}

function init() {
  const dates = getAvailableDates();
  if (dates.length > 0) {
    currentDate = dates[0];
  } else {
    const today = new Date().toISOString().split('T')[0];
    currentDate = today;
  }
  document.getElementById('dateInput').value = currentDate;
  renderDateChips();
  renderTable();
}

function renderDateChips() {
  const container = document.getElementById('dateChips');
  const dates = getAvailableDates();
  const activeClass = currentTab === 'hongguo' ? 'active-hongguo' : 'active';
  container.innerHTML = dates.map(d =>
    `<div class="date-chip ${d === currentDate ? activeClass : ''}" onclick="loadDate('${d}')">${d}</div>`
  ).join('');
}

function loadDate(date) {
  currentDate = date;
  document.getElementById('dateInput').value = date;
  renderDateChips();
  renderTable();
}

function navigateDate(dir) {
  const dates = getAvailableDates();
  const idx = dates.indexOf(currentDate);
  if (idx === -1) return;
  const newIdx = idx - dir;
  if (newIdx >= 0 && newIdx < dates.length) {
    loadDate(dates[newIdx]);
  }
}

function switchTab(tab) {

function parseAndSave() {
  const date = document.getElementById('modalDate').value;
  const type = document.getElementById('modalType').value;
  const raw = document.getElementById('modalData').value.trim();
  if (!date) { alert('请选择日期'); return; }
  if (!raw) { alert('请粘贴数据'); return; }
  const lines = raw.split('\n').filter(l => l.trim());
  const items = [];
  for (const line of lines) {
    const parts = line.includes('|') ? line.split('|').map(s => s.trim()) : line.split('\t').map(s => s.trim());
    if (type === 'douyin') {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], account: parts[2] || '', affiliate: parts[3] || '', episodes: parseInt(parts[4]) || 0, type: parts[5] || '', newPlay: parts[6] || '', totalPlay: parts[7] || '' });
      }
    } else {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], tags: parts[2] || '', publisher: parts[3] || '', onlineDate: parts[4] || '', episodes: parseInt(parts[5]) || 0, hotValue: parts[6] || '' });
      }
    }
  }
  if (items.length === 0) { alert('未能解析出有效数据，请检查格式'); return; }
  if (!allData[date]) { allData[date] = { douyin: null, hongguo: null }; }
  const formattedDate = date.replace(/-/g, '/').replace(/^(\d{4})\/0?(\d+)\/0?(\d+)$/, '$1/$2/$3');
  if (type === 'douyin') { allData[date].douyin = { date: formattedDate, items }; }
  else { allData[date].hongguo = { date: formattedDate, items }; }
  saveAllData(allData);
  alert(`✅ 成功保存 ${items.length} 条${type === 'douyin' ? '抖音' : '红果'}榜数据！`);
  closeModal();
  document.getElementById('modalData').value = '';
  loadDate(date);
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      for (const [date, data] of Object.entries(imported)) {
        if (!allData[date]) { allData[date] = data; }
        else { if (data.douyin) allData[date].douyin = data.douyin; if (data.hongguo) allData[date].hongguo = data.hongguo; }
      }
      saveAllData(allData);
      alert('✅ 导入成功！');
      init();
    } catch(e) { alert('❌ 导入失败：JSON格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function escapeCSV(val) {
  const s = String(val == null ? '' : val);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) { return '"' + s.replace(/"/g, '""') + '"'; }
  return s;
}

function downloadCSV(filename, csvContent) {
  const bom = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}

// 核心分析函数
function analyzeQuestion(q) {
  const dates = getAvailableDates();
  const ql = q.toLowerCase();

  // 题材/标签分析
  if (ql.includes('题材') || ql.includes('标签') || ql.includes('类型分布') || ql.includes('tag')) {
    return analyzeGenres(dates, ql);
  }

  // 跨平台对比
  if ((ql.includes('抖音') && ql.includes('红果')) || ql.includes('都上榜') || ql.includes('跨平台') || ql.includes('两个平台')) {
    return analyzeCrossPlatform(dates);
  }

  // 新上榜分析
  if (ql.includes('新上榜') || ql.includes('新作') || ql.includes('新入榜') || ql.includes('新剧')) {
    return analyzeNewEntries(dates);
  }

  // 版权方/出品方分析
  if (ql.includes('版权') || ql.includes('出品') || ql.includes('publisher') || ql.includes('制作方')) {
    return analyzePublishers(dates);
  }

  // 热度/播放量最高
  if (ql.includes('热度最高') || ql.includes('最热') || ql.includes('播放最高') || ql.includes('top1') || ql.includes('榜首')) {
    return analyzeTopPerformers(dates);
  }

  // 排名变化
  if (ql.includes('排名变化') || ql.includes('上升') || ql.includes('下降') || ql.includes('排名')) {
    return analyzeRankChanges(dates);
  }

  // 账号分析（抖音）
  if (ql.includes('账号') || ql.includes('发布者') || ql.includes('account')) {
    return analyzeAccounts(dates);
  }

  // 集数分析
  if (ql.includes('集数') || ql.includes('最长') || ql.includes('最短') || ql.includes('episode')) {
    return analyzeEpisodes(dates);
  }

  // 概览/总结
  if (ql.includes('概览') || ql.includes('总结') || ql.includes('概况') || ql.includes('数据量') || ql.includes('有多少')) {
    return analyzeOverview(dates);
  }

  // 具体作品查询
  const matchedDrama = findDramaByName(q, dates);
  if (matchedDrama) {
    return analyzeDrama(matchedDrama, dates);
  }

  // 默认：智能概览
  return {
    html: `我可以帮你分析以下方面的数据：<br><br>
      📊 <strong>题材趋势</strong> — 各标签/类型的上榜分布和变化<br>
      🔄 <strong>跨平台对比</strong> — 同时出现在抖音和红果的作品<br>
      🆕 <strong>新上榜作品</strong> — 当天新进入榜单的作品<br>
      🏢 <strong>版权方分析</strong> — 出品方/版权方的上榜数量<br>
      📈 <strong>排名变化</strong> — 作品在不同日期的排名变动<br>
      🎬 <strong>作品查询</strong> — 直接输入剧名查看详情<br><br>
      试试上面的快捷按钮，或直接提问！`,
    suggestions: ['Top10 题材变化', '跨平台对比', '新上榜作品', '数据概览', '版权方排名', '集数分析']
  };
}

function analyzeGenres(dates, ql) {
  const genreMap = {};
  const dateGenres = {};

  for (const date of dates) {
    const dayData = allData[date] || {};
    dateGenres[date] = {};

    // 红果标签
    if (dayData.hongguo && dayData.hongguo.items) {
      for (const item of dayData.hongguo.items) {
        const tags = (item.tags || '').split('/').map(t => t.trim()).filter(Boolean);
        for (const tag of tags) {
          genreMap[tag] = (genreMap[tag] || 0) + 1;
          dateGenres[date][tag] = (dateGenres[date][tag] || 0) + 1;
        }
      }
    }
    // 抖音类型
    if (dayData.douyin && dayData.douyin.items) {
      for (const item of dayData.douyin.items) {
        const type = (item.type || '').trim();
        if (type && type !== '0') {
          genreMap[type] = (genreMap[type] || 0) + 1;
          dateGenres[date][type] = (dateGenres[date][type] || 0) + 1;
        }
      }
    }
  }

  const sorted = Object.entries(genreMap).sort((a, b) => b[1] - a[1]);
  const top10 = sorted.slice(0, 10);

  let html = `<strong>📊 题材/标签 Top 10 分布</strong>（全部 ${dates.length} 天数据汇总）<br><br>`;
  top10.forEach((item, i) => {
    const bar = '█'.repeat(Math.min(Math.ceil(item[1] / 2), 15));
    html += `${i + 1}. <span class="tag">${item[0]}</span> — 出现 <span class="num">${item[1]}</span> 次 <span style="color:#8B5CF6;font-size:11px">${bar}</span><br>`;
  });

  // 变化趋势（如果有多天数据）
  if (dates.length >= 2) {
    const latest = dates[0];
    const prev = dates[1];
    const latestTags = dateGenres[latest] || {};
    const prevTags = dateGenres[prev] || {};

    const rising = [];
    const falling = [];
    const allTags = new Set([...Object.keys(latestTags), ...Object.keys(prevTags)]);

    for (const tag of allTags) {
      const diff = (latestTags[tag] || 0) - (prevTags[tag] || 0);
      if (diff > 0) rising.push({ tag, diff });
      else if (diff < 0) falling.push({ tag, diff: Math.abs(diff) });
    }

    rising.sort((a, b) => b.diff - a.diff);
    falling.sort((a, b) => b.diff - a.diff);

    if (rising.length > 0 || falling.length > 0) {
      html += `<br><strong>📈 最近趋势</strong>（${prev} → ${latest}）<br>`;
      if (rising.length > 0) {
        html += `🔺 热度上升：${rising.slice(0, 5).map(r => `<span class="tag">${r.tag}</span> +${r.diff}`).join('、')}<br>`;
      }
      if (falling.length > 0) {
        html += `🔻 热度下降：${falling.slice(0, 5).map(r => `<span class="tag">${r.tag}</span> -${r.diff}`).join('、')}<br>`;
      }
    }
  }

  return { html, suggestions: ['新上榜作品', '版权方排名', '跨平台对比'] };
}

function analyzeCrossPlatform(dates) {
  let html = '<strong>🔄 抖音 & 红果跨平台上榜分析</strong><br><br>';
  let foundAny = false;

  for (const date of dates) {
    const dayData = allData[date] || {};
    if (!dayData.douyin || !dayData.hongguo) continue;

    const douyinNames = new Set(dayData.douyin.items.map(i => i.name));
    const hongguoNames = new Set(dayData.hongguo.items.map(i => i.name));
    const both = [...douyinNames].filter(n => hongguoNames.has(n));

    if (both.length > 0) {
      foundAny = true;
      html += `📅 <strong>${date}</strong> — 共 <span class="num">${both.length}</span> 部同时上榜：<br>`;
      for (const name of both) {
        const dy = dayData.douyin.items.find(i => i.name === name);
        const hg = dayData.hongguo.items.find(i => i.name === name);
        html += `&nbsp;&nbsp;• <span class="highlight">${name}</span> — 抖音 #${dy.rank}（新增${dy.newPlay}），红果 #${hg.rank}（热度${hg.hotValue}）<br>`;
      }
      html += '<br>';
    }
  }

  if (!foundAny) {
    html += '目前各日期的数据中，暂未发现同时出现在两个平台 Top 30 的作品。<br><br>';
    html += '这可能说明两个平台的用户偏好差异较大，或者数据收集的时间不同步。';
  }

  return { html, suggestions: ['题材分布', '排名变化', '热度最高作品'] };
}

function analyzeNewEntries(dates) {
  if (dates.length < 2) {
    return { html: '需要至少两天的数据才能分析新上榜作品，目前数据还不够。', suggestions: ['数据概览'] };
  }

  const latest = dates[0];
  const prev = dates[1];
  const latestData = allData[latest] || {};
  const prevData = allData[prev] || {};

  let html = `<strong>🆕 新上榜作品分析</strong>（${prev} → ${latest}）<br><br>`;

  // 红果新上榜
  if (latestData.hongguo && prevData.hongguo) {
    const prevNames = new Set(prevData.hongguo.items.map(i => i.name));
    const newItems = latestData.hongguo.items.filter(i => !prevNames.has(i.name));
    const exitItems = prevData.hongguo.items.filter(i => !latestData.hongguo.items.find(j => j.name === i.name));

    html += `🍎 <strong>红果榜</strong>：<br>`;
    if (newItems.length > 0) {
      html += `&nbsp;&nbsp;新入榜 <span class="num">${newItems.length}</span> 部：<br>`;
      newItems.forEach(item => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;📗 <span class="highlight">${item.name}</span> #${item.rank}（${item.hotValue}）<span class="tag">${item.tags}</span><br>`;
      });
    } else {
      html += '&nbsp;&nbsp;无新入榜作品（Top 30 完全一致）<br>';
    }
    if (exitItems.length > 0) {
      html += `&nbsp;&nbsp;掉出榜单 <span class="num">${exitItems.length}</span> 部：${exitItems.map(i => i.name).join('、')}<br>`;
    }
    html += '<br>';
  }

  // 抖音新上榜
  if (latestData.douyin && prevData.douyin) {
    const prevNames = new Set(prevData.douyin.items.map(i => i.name));
    const newItems = latestData.douyin.items.filter(i => !prevNames.has(i.name));
    const exitItems = prevData.douyin.items.filter(i => !latestData.douyin.items.find(j => j.name === i.name));

    html += `🎵 <strong>抖音榜</strong>：<br>`;
    if (newItems.length > 0) {
      html += `&nbsp;&nbsp;新入榜 <span class="num">${newItems.length}</span> 部：<br>`;
      newItems.forEach(item => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;📘 <span class="highlight">${item.name}</span> #${item.rank}（新增${item.newPlay}）<br>`;
      });
    } else {
      html += '&nbsp;&nbsp;无新入榜作品<br>';
    }
    if (exitItems.length > 0) {
      html += `&nbsp;&nbsp;掉出榜单 <span class="num">${exitItems.length}</span> 部：${exitItems.map(i => i.name).join('、')}<br>`;
    }
  }

  return { html, suggestions: ['排名变化', '题材变化', '跨平台对比'] };
}

function analyzePublishers(dates) {
  const pubMap = {};

  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.hongguo && dayData.hongguo.items) {
      for (const item of dayData.hongguo.items) {
        const pub = item.publisher || '未知';
        if (!pubMap[pub]) pubMap[pub] = { count: 0, dramas: new Set(), bestRank: 999 };
        pubMap[pub].count++;
        pubMap[pub].dramas.add(item.name);
        pubMap[pub].bestRank = Math.min(pubMap[pub].bestRank, item.rank);
      }
    }
  }

  const sorted = Object.entries(pubMap).sort((a, b) => b[1].count - a[1].count);
  const top10 = sorted.slice(0, 10);

  let html = `<strong>🏢 版权方上榜排名 Top 10</strong>（红果榜 ${dates.length} 天汇总）<br><br>`;
  top10.forEach((item, i) => {
    const [name, data] = item;
    const dramaList = [...data.dramas].slice(0, 3).join('、');
    html += `${i + 1}. <strong>${name}</strong><br>`;
    html += `&nbsp;&nbsp;&nbsp;上榜 <span class="num">${data.count}</span> 次 | ${data.dramas.size} 部作品 | 最高 #${data.bestRank}<br>`;
    html += `&nbsp;&nbsp;&nbsp;代表作：${dramaList}<br><br>`;
  });

  return { html, suggestions: ['题材分布', '新上榜作品', '账号分析'] };
}

function analyzeRankChanges(dates) {
  if (dates.length < 2) {
    return { html: '需要至少两天的数据才能分析排名变化。', suggestions: ['数据概览'] };
  }

  const latest = dates[0];
  const prev = dates[1];
  let html = `<strong>📈 排名变化分析</strong>（${prev} → ${latest}）<br><br>`;

  // 红果排名变化
  const latestHG = (allData[latest] || {}).hongguo;
  const prevHG = (allData[prev] || {}).hongguo;

  if (latestHG && prevHG) {
    html += `🍎 <strong>红果榜排名变化：</strong><br>`;
    const changes = [];
    for (const item of latestHG.items) {
      const prevItem = prevHG.items.find(i => i.name === item.name);
      if (prevItem) {
        const diff = prevItem.rank - item.rank;
        changes.push({ name: item.name, rank: item.rank, diff, prevRank: prevItem.rank });
      }
    }

    const risers = changes.filter(c => c.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
    const fallers = changes.filter(c => c.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);

    if (risers.length > 0) {
      html += '&nbsp;&nbsp;🔺 上升最快：<br>';
      risers.forEach(c => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;<span class="highlight">${c.name}</span> #${c.prevRank} → #${c.rank}（↑<span class="num">${c.diff}</span>位）<br>`;
      });
    }
    if (fallers.length > 0) {
      html += '&nbsp;&nbsp;🔻 下降最多：<br>';
      fallers.forEach(c => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;<span class="highlight">${c.name}</span> #${c.prevRank} → #${c.rank}（↓${Math.abs(c.diff)}位）<br>`;
      });
    }
    html += '<br>';
  }

  // 抖音排名变化
  const latestDY = (allData[latest] || {}).douyin;
  const prevDY = (allData[prev] || {}).douyin;

  if (latestDY && prevDY) {
    html += `🎵 <strong>抖音榜排名变化：</strong><br>`;
    const changes = [];
    for (const item of latestDY.items) {
      const prevItem = prevDY.items.find(i => i.name === item.name);
      if (prevItem) {
        const diff = prevItem.rank - item.rank;
        changes.push({ name: item.name, rank: item.rank, diff, prevRank: prevItem.rank });
      }
    }

    const risers = changes.filter(c => c.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
    const fallers = changes.filter(c => c.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);

    if (risers.length > 0) {
      html += '&nbsp;&nbsp;🔺 上升最快：<br>';
      risers.forEach(c => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;<span class="highlight">${c.name}</span> #${c.prevRank} → #${c.rank}（↑<span class="num">${c.diff}</span>位）<br>`;
      });
    }
    if (fallers.length > 0) {
      html += '&nbsp;&nbsp;🔻 下降最多：<br>';
      fallers.forEach(c => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;<span class="highlight">${c.name}</span> #${c.prevRank} → #${c.rank}（↓${Math.abs(c.diff)}位）<br>`;
      });
    }
  }

  return { html, suggestions: ['新上榜作品', '题材变化', '热度最高作品'] };
}

function analyzeEpisodes(dates) {
  const allEpisodes = [];

  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.hongguo && dayData.hongguo.items) {
      for (const item of dayData.hongguo.items) {
        allEpisodes.push({ name: item.name, episodes: item.episodes, platform: '红果', date });
      }
    }
    if (dayData.douyin && dayData.douyin.items) {
      for (const item of dayData.douyin.items) {
        allEpisodes.push({ name: item.name, episodes: item.episodes, platform: '抖音', date });
      }
    }
  }

  // 去重
  const seen = new Set();
  const unique = allEpisodes.filter(e => {
    const key = e.name + e.platform;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  unique.sort((a, b) => b.episodes - a.episodes);
  const longest = unique.slice(0, 5);
  const shortest = [...unique].sort((a, b) => a.episodes - b.episodes).slice(0, 5);

  const avg = Math.round(unique.reduce((s, e) => s + e.episodes, 0) / unique.length);

  let html = `<strong>🎬 集数分析</strong><br><br>`;
  html += `平均集数：<span class="num">${avg}</span> 集<br><br>`;

  html += '📏 <strong>集数最多</strong>：<br>';
  longest.forEach(e => {
    html += `&nbsp;&nbsp;• <span class="highlight">${e.name}</span> — <span class="num">${e.episodes}</span> 集（${e.platform}）<br>`;
  });

  html += '<br>📐 <strong>集数最少</strong>：<br>';
  shortest.forEach(e => {
    html += `&nbsp;&nbsp;• <span class="highlight">${e.name}</span> — <span class="num">${e.episodes}</span> 集（${e.platform}）<br>`;
  });

  return { html, suggestions: ['题材分布', '版权方排名', '热度最高作品'] };
}

function analyzeOverview(dates) {
  let totalDouyin = 0, totalHongguo = 0;
  const allDramas = new Set();

  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      totalDouyin += dayData.douyin.items.length;
      dayData.douyin.items.forEach(i => allDramas.add(i.name));
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      totalHongguo += dayData.hongguo.items.length;
      dayData.hongguo.items.forEach(i => allDramas.add(i.name));
    }
  }

  let html = `<strong>📋 数据概览</strong><br><br>`;
  html += `📅 收录天数：<span class="num">${dates.length}</span> 天（${dates[dates.length - 1]} ~ ${dates[0]}）<br>`;
  html += `🎬 独立作品数：<span class="num">${allDramas.size}</span> 部<br>`;
  html += `🎵 抖音榜记录：<span class="num">${totalDouyin}</span> 条<br>`;
  html += `🍎 红果榜记录：<span class="num">${totalHongguo}</span> 条<br>`;
  html += `📊 总数据量：<span class="num">${totalDouyin + totalHongguo}</span> 条<br><br>`;

  html += '<strong>各日期数据情况：</strong><br>';
  for (const date of dates) {
    const dayData = allData[date] || {};
    const dy = dayData.douyin ? `抖音 ${dayData.douyin.items.length} 条` : '抖音 ❌';
    const hg = dayData.hongguo ? `红果 ${dayData.hongguo.items.length} 条` : '红果 ❌';
    html += `&nbsp;&nbsp;${date}：${dy} | ${hg}<br>`;
  }

  return { html, suggestions: ['题材分布', '版权方排名', '新上榜作品', '热度最高作品'] };
}

function findDramaByName(query, dates) {
  const q = query.replace(/[？?。，,！!]/g, '').trim();
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => q.includes(i.name) || i.name.includes(q));
      if (found) return { ...found, platform: 'douyin', date };
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => q.includes(i.name) || i.name.includes(q));
      if (found) return { ...found, platform: 'hongguo', date };
    }
  }
  return null;
}

function analyzeDrama(drama, dates) {
  let html = `<strong>🎬 「${drama.name}」详情</strong><br><br>`;

  // 查找简介
  let synopsis = '';
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => i.name === drama.name);
      if (found && found.synopsis) { synopsis = found.synopsis; break; }
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => i.name === drama.name);
      if (found && found.synopsis) { synopsis = found.synopsis; break; }
    }
  }

  if (synopsis) {
    html += `📝 <strong>简介：</strong>${synopsis}<br><br>`;
  }

  // 在所有日期中查找
  const appearances = [];
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => i.name === drama.name);
      if (found) appearances.push({ ...found, platform: '抖音', date });
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => i.name === drama.name);
      if (found) appearances.push({ ...found, platform: '红果', date });
    }
  }

  html += `上榜记录：<span class="num">${appearances.length}</span> 次<br><br>`;

  for (const app of appearances) {
    html += `📅 ${app.date} | ${app.platform} #${app.rank}`;
    if (app.newPlay) html += ` | 新增 ${app.newPlay}`;
    if (app.hotValue) html += ` | 热度 ${app.hotValue}`;
    if (app.tags) html += ` | <span class="tag">${app.tags}</span>`;
    if (app.type && app.type !== '0') html += ` | <span class="tag">${app.type}</span>`;
    html += '<br>';
  }

  return { html, suggestions: ['排名变化', '题材分布', '跨平台对比'] };
}
