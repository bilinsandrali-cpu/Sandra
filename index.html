  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

  }

  .header-left {

    align-items: center;

  }

  .logo {

    font-size: 16px;
    font-weight: 700;

    border: none;
    background: transparent;
    color: var(--text-muted);
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.5px;
  }

  .top-tab:hover {
    color: var(--text);
  }

  .top-tab::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: transparent;
    transition: background 0.2s;
  }

  .top-tab.active-douyin {
    color: #A78BFA;
  }

  .top-tab.active-douyin::after {
    background: var(--douyin-gradient);
  }

  .top-tab.active-hongguo {
    color: #FBBF24;
  }

  .top-tab.active-hongguo::after {
    background: var(--hongguo-gradient);
  }

  .date-bar {

    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    background: rgba(26, 26, 46, 0.6);

  }

  .date-bar-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .date-selector {
    display: flex;
    align-items: center;
    gap: 6px;
  }

    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .date-nav-btn {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .date-nav-btn:hover {
    background: #3a3a5e;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    color: white;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  .btn-secondary {
    background: #2a2a3e;
    color: var(--text);
    border: 1px solid #3a3a4e;
  }

  .btn-secondary:hover { background: #3a3a5e; }

  .btn-export {
    background: linear-gradient(135deg, #059669, #10B981);
    color: white;
  }

  .btn-export:hover { opacity: 0.9; }

  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-menu {

    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: #1e1e32;
    border: 1px solid #3a3a4e;
    border-radius: 10px;
    min-width: 200px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 6px;
    animation: dropIn 0.15s ease-out;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-menu.show { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
    white-space: nowrap;

  .dropdown-item:hover {
    background: rgba(139, 92, 246, 0.15);
    color: #A78BFA;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 8px;
  }

  .main {

    margin: 0 auto;
    padding: 24px;
  }

  .table-container {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);

  .medal-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }

  .drama-name {

  }

  .highlight-value {

  .highlight-value.hongguo { color: #F59E0B; }

  </div>
</div>

<div class="modal-overlay" id="addModal">

    </div>

    </div>
    <div class="form-group">

    </div>

</div>

function loadAllData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch(e) {}
  }
  const defaultData = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
  return defaultData;
}

function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let allData = loadAllData();
let currentDate = '';
let currentTab = 'douyin';

function getAvailableDates() {
  return Object.keys(allData).sort().reverse();
}

function init() {
  const dates = getAvailableDates();
  if (dates.length > 0) {
    currentDate = dates[0];
  } else {
    const today = new Date().toISOString().split('T')[0];
    currentDate = today;
  }
  document.getElementById('dateInput').value = currentDate;
  renderDateChips();
  renderTable();
}

function renderDateChips() {
  const container = document.getElementById('dateChips');
  const dates = getAvailableDates();
  const activeClass = currentTab === 'hongguo' ? 'active-hongguo' : 'active';
  container.innerHTML = dates.map(d =>
    `<div class="date-chip ${d === currentDate ? activeClass : ''}" onclick="loadDate('${d}')">${d}</div>`
  ).join('');
}

function loadDate(date) {
  currentDate = date;
  document.getElementById('dateInput').value = date;
  renderDateChips();
  renderTable();
}

function navigateDate(dir) {
  const dates = getAvailableDates();
  const idx = dates.indexOf(currentDate);
  if (idx === -1) return;
  const newIdx = idx - dir;
  if (newIdx >= 0 && newIdx < dates.length) {
    loadDate(dates[newIdx]);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDouyin').className = tab === 'douyin' ? 'top-tab active-douyin' : 'top-tab';
  document.getElementById('tabHongguo').className = tab === 'hongguo' ? 'top-tab active-hongguo' : 'top-tab';
  document.getElementById('douyinTable').style.display = tab === 'douyin' ? 'block' : 'none';
  document.getElementById('hongguoTable').style.display = tab === 'hongguo' ? 'block' : 'none';
  renderDateChips();
}

function getRankHTML(rank) {
  if (rank <= 3) {
    return `<span class="rank-medal medal-${rank}">${rank}</span>`;
  }
  return `<span style="color:var(--text-muted)">${rank}</span>`;
}

function showAddModal() {
  document.getElementById('addModal').classList.add('show');
  document.getElementById('modalDate').value = currentDate || new Date().toISOString().split('T')[0];
}

function closeModal() {
  document.getElementById('addModal').classList.remove('show');
}

function parseAndSave() {
  const date = document.getElementById('modalDate').value;
  const type = document.getElementById('modalType').value;
  const raw = document.getElementById('modalData').value.trim();
  if (!date) { alert('请选择日期'); return; }
  if (!raw) { alert('请粘贴数据'); return; }
  const lines = raw.split('\n').filter(l => l.trim());
  const items = [];
  for (const line of lines) {
    const parts = line.includes('|') ? line.split('|').map(s => s.trim()) : line.split('\t').map(s => s.trim());
    if (type === 'douyin') {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], account: parts[2] || '', affiliate: parts[3] || '', episodes: parseInt(parts[4]) || 0, type: parts[5] || '', newPlay: parts[6] || '', totalPlay: parts[7] || '' });
      }
    } else {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], tags: parts[2] || '', publisher: parts[3] || '', onlineDate: parts[4] || '', episodes: parseInt(parts[5]) || 0, hotValue: parts[6] || '' });
      }
    }
  }
  if (items.length === 0) { alert('未能解析出有效数据，请检查格式'); return; }
  if (!allData[date]) { allData[date] = { douyin: null, hongguo: null }; }
  const formattedDate = date.replace(/-/g, '/').replace(/^(\d{4})\/0?(\d+)\/0?(\d+)$/, '$1/$2/$3');
  if (type === 'douyin') { allData[date].douyin = { date: formattedDate, items }; }
  else { allData[date].hongguo = { date: formattedDate, items }; }
  saveAllData(allData);
  alert(`✅ 成功保存 ${items.length} 条${type === 'douyin' ? '抖音' : '红果'}榜数据！`);
  closeModal();
  document.getElementById('modalData').value = '';
  loadDate(date);
}

function exportData() {
  const json = JSON.stringify(allData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `漫剧热度日报_${new Date().toISOString().split('T')[0]}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importData() { document.getElementById('fileInput').click(); }

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      for (const [date, data] of Object.entries(imported)) {
        if (!allData[date]) { allData[date] = data; }
        else { if (data.douyin) allData[date].douyin = data.douyin; if (data.hongguo) allData[date].hongguo = data.hongguo; }
      }
      saveAllData(allData);
      alert('✅ 导入成功！');
      init();
    } catch(e) { alert('❌ 导入失败：JSON格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

document.getElementById('addModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('click', function(e) { if (!e.target.closest('.dropdown')) { const dd = document.getElementById('exportDropdown'); if (dd) dd.classList.remove('show'); } });

function toggleDropdown() { document.getElementById('exportDropdown').classList.toggle('show'); }

function escapeCSV(val) {
  const s = String(val == null ? '' : val);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) { return '"' + s.replace(/"/g, '""') + '"'; }
  return s;
}

function downloadCSV(filename, csvContent) {
  const bom = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}

function exportCurrentCSV() {
  document.getElementById('exportDropdown').classList.remove('show');
  const dayData = allData[currentDate] || {};
  if (currentTab === 'douyin') {
    const data = dayData.douyin;
    if (!data || data.items.length === 0) { alert('当前日期暂无抖音榜数据'); return; }
    const headers = ['排名', '剧名', '账号', '关联方', '集数', '类型', '新增播放', '累计播放'];
    const rows = data.items.map(item => [item.rank, item.name, item.account, item.affiliate, item.episodes, item.type, item.newPlay, item.totalPlay]);
    const csv = [headers, ...rows].map(row => row.map(escapeCSV).join(',')).join('\n');
    downloadCSV(`抖音漫剧热播榜_${currentDate}.csv`, csv);
  } else {
    const data = dayData.hongguo;
    if (!data || data.items.length === 0) { alert('当前日期暂无红果榜数据'); return; }
    const headers = ['排名', '剧名', '标签', '版权方', '上线时间', '集数', '热度值'];
    const rows = data.items.map(item => [item.rank, item.name, item.tags, item.publisher, item.onlineDate, item.episodes, item.hotValue]);
    const csv = [headers, ...rows].map(row => row.map(escapeCSV).join(',')).join('\n');
    downloadCSV(`红果漫剧热播榜_${currentDate}.csv`, csv);
  }
}

function exportAllCSV() {
  document.getElementById('exportDropdown').classList.remove('show');
  const dates = getAvailableDates().reverse();
  const douyinHeaders = ['日期', '排名', '剧名', '账号', '关联方', '集数', '类型', '新增播放', '累计播放'];
  const douyinRows = [];
  for (const date of dates) { const dayData = allData[date]; if (dayData && dayData.douyin && dayData.douyin.items.length > 0) { for (const item of dayData.douyin.items) { douyinRows.push([date, item.rank, item.name, item.account, item.affiliate, item.episodes, item.type, item.newPlay, item.totalPlay]); } } }
  const hongguoHeaders = ['日期', '排名', '剧名', '标签', '版权方', '上线时间', '集数', '热度值'];
  const hongguoRows = [];
  for (const date of dates) { const dayData = allData[date]; if (dayData && dayData.hongguo && dayData.hongguo.items.length > 0) { for (const item of dayData.hongguo.items) { hongguoRows.push([date, item.rank, item.name, item.tags, item.publisher, item.onlineDate, item.episodes, item.hotValue]); } } }
  let csv = '=== 抖音漫剧热播榜 ===\n';
  csv += [douyinHeaders, ...douyinRows].map(row => row.map(escapeCSV).join(',')).join('\n');
  csv += '\n\n=== 红果漫剧热播榜 ===\n';
  csv += [hongguoHeaders, ...hongguoRows].map(row => row.map(escapeCSV).join(',')).join('\n');
  const today = new Date().toISOString().split('T')[0];
  downloadCSV(`漫剧热度日报_全部数据_${today}.csv`, csv);
}

function exportExcel() {
  document.getElementById('exportDropdown').classList.remove('show');
  if (typeof XLSX === 'undefined') { alert('Excel导出库加载失败，请检查网络连接后刷新页面重试。'); return; }
  const wb = XLSX.utils.book_new();
  const dates = getAvailableDates().reverse();
  const douyinAoa = [['日期', '排名', '剧名', '账号', '关联方', '集数', '类型', '新增播放', '累计播放']];
  for (const date of dates) { const dayData = allData[date]; if (dayData && dayData.douyin && dayData.douyin.items.length > 0) { for (const item of dayData.douyin.items) { douyinAoa.push([date, item.rank, item.name, item.account, item.affiliate, item.episodes, item.type, item.newPlay, item.totalPlay]); } } }
  const ws1 = XLSX.utils.aoa_to_sheet(douyinAoa);
  ws1['!cols'] = [{wch:12},{wch:5},{wch:28},{wch:16},{wch:10},{wch:6},{wch:16},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws1, '抖音漫剧热播榜');
  const hongguoAoa = [['日期', '排名', '剧名', '标签', '版权方', '上线时间', '集数', '热度值']];
  for (const date of dates) { const dayData = allData[date]; if (dayData && dayData.hongguo && dayData.hongguo.items.length > 0) { for (const item of dayData.hongguo.items) { hongguoAoa.push([date, item.rank, item.name, item.tags, item.publisher, item.onlineDate, item.episodes, item.hotValue]); } } }
  const ws2 = XLSX.utils.aoa_to_sheet(hongguoAoa);
  ws2['!cols'] = [{wch:12},{wch:5},{wch:28},{wch:30},{wch:24},{wch:10},{wch:6},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, '红果漫剧热播榜');
  const today = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `漫剧热度日报_${today}.xlsx`);
}
