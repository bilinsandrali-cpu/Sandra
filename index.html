<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>红果漫剧每日top30</title>
<style>
  :root {
    --douyin-primary: #5B2D8E;
    --douyin-gradient: linear-gradient(135deg, #5B2D8E 0%, #8B5CF6 50%, #EC4899 100%);
    --hongguo-primary: #E8652D;
    --hongguo-gradient: linear-gradient(135deg, #E8652D 0%, #F59E0B 100%);
    --bg: #0f0f1a;
    --card-bg: #1a1a2e;
    --text: #e0e0e0;
    --text-muted: #888;
    --border: #2a2a3e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 20px 32px 0;
    border-bottom: none;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .top-tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
  }

  .top-tab {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.5px;
  }

  .top-tab:hover {
    color: var(--text);
  }

  .top-tab::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: transparent;
    transition: background 0.2s;
  }

  .top-tab.active-douyin {
    color: #A78BFA;
  }

  .top-tab.active-douyin::after {
    background: var(--douyin-gradient);
  }

  .top-tab.active-hongguo {
    color: #FBBF24;
  }

  .top-tab.active-hongguo::after {
    background: var(--hongguo-gradient);
  }

  .table-title-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .table-title-icon {
    font-size: 18px;
  }

  .table-title-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .platform-select {
    padding: 6px 12px;
    font-size: 15px;
    font-weight: 600;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: auto;
    appearance: auto;
  }

  .platform-select:hover {
    border-color: var(--text-muted);
  }

  .platform-select:focus {
    border-color: #A78BFA;
    box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
  }

  .date-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    background: rgba(26, 26, 46, 0.6);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .date-bar-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .date-selector {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-selector input[type="date"] {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .date-nav-btn {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .date-nav-btn:hover {
    background: #3a3a5e;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    color: white;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  .btn-secondary {
    background: #2a2a3e;
    color: var(--text);
    border: 1px solid #3a3a4e;
  }

  .btn-secondary:hover { background: #3a3a5e; }

  .btn-sync {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    position: relative;
  }
  .btn-sync:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-sync.has-changes::after {
    content: '';
    position: absolute;
    top: -3px;
    right: -3px;
    width: 10px;
    height: 10px;
    background: #ef4444;
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .sync-modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 28px;
    width: min(520px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .sync-modal h3 { margin: 0 0 16px; font-size: 18px; }
  .sync-info {
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 16px;
    color: #c4b5fd;
  }
  .sync-info a { color: #a78bfa; }
  .sync-diff {
    background: #1a1a2e;
    border-radius: 8px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 16px;
    max-height: 320px;
    overflow-y: auto;
  }
  .sync-diff .diff-add { color: #4ade80; }
  .sync-diff .diff-remove { color: #f87171; }
  .sync-diff .diff-section { color: #94a3b8; font-weight: bold; margin-top: 8px; }
  .sync-diff .diff-summary {
    background: rgba(99,102,241,0.15);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .sync-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 16px;
  }
  .btn-text {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 8px;
  }
  .btn-text:hover { color: var(--text); }
  .sync-progress-bar {
    height: 6px;
    background: #2a2a3e;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .sync-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
  }
  .sync-status {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  .sync-success { color: #4ade80 !important; }
  .sync-error { color: #f87171 !important; }

  .btn-export {
    background: linear-gradient(135deg, #059669, #10B981);
    color: white;
  }

  .btn-export:hover { opacity: 0.9; }

  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: #1e1e32;
    border: 1px solid #3a3a4e;
    border-radius: 10px;
    min-width: 200px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 6px;
    animation: dropIn 0.15s ease-out;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-menu.show { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .dropdown-item:hover {
    background: rgba(139, 92, 246, 0.15);
    color: #A78BFA;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 8px;
  }

  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  .table-container {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .table-header-bar {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .table-title {
    font-size: 18px;
    font-weight: 700;
  }

  .table-title.douyin { color: #8B5CF6; }
  .table-title.hongguo { color: #F59E0B; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 14px 16px;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  tbody tr:hover {
    background: rgba(255,255,255,0.03);
  }

  .rank-cell {
    font-weight: 700;
    font-size: 16px;
    width: 50px;
    text-align: center;
  }

  .rank-1 { color: #FFD700; }
  .rank-2 { color: #C0C0C0; }
  .rank-3 { color: #CD7F32; }

  .rank-medal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
  }

  .medal-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
  .medal-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: #000; }
  .medal-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }

  .drama-name {
    font-weight: 600;
    color: #fff;
    max-width: 220px;
    cursor: pointer;
    position: relative;
  }

  .drama-name:hover { color: #A78BFA; }

  .drama-name .synopsis-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(139,92,246,0.2);
    color: #A78BFA;
    font-size: 10px;
    text-align: center;
    line-height: 16px;
    margin-left: 4px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .synopsis-row td {
    padding: 0 !important;
    border-bottom: 1px solid rgba(139,92,246,0.1) !important;
  }

  .synopsis-content {
    padding: 12px 20px 12px 76px;
    font-size: 13px;
    line-height: 1.7;
    color: #aaa;
    background: rgba(139,92,246,0.04);
    border-left: 3px solid rgba(139,92,246,0.3);
    margin: 0;
    animation: synopsisFadeIn 0.2s ease-out;
  }

  .synopsis-content strong {
    color: #A78BFA;
    font-size: 12px;
    margin-right: 6px;
  }

  @keyframes synopsisFadeIn {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 200px; }
  }

  .highlight-value {
    font-weight: 700;
  }

  .highlight-value.douyin { color: #8B5CF6; }
  .highlight-value.hongguo { color: #F59E0B; }

  .type-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    background: rgba(139, 92, 246, 0.15);
    color: #A78BFA;
  }

  .type-tag.hongguo {
    background: rgba(245, 158, 11, 0.15);
    color: #FBBF24;
  }

  .drama-type-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .drama-type-tag.type-ai {
    background: rgba(139, 92, 246, 0.2);
    color: #C4B5FD;
  }
  .drama-type-tag.type-2d {
    background: rgba(59, 130, 246, 0.2);
    color: #93C5FD;
  }
  .drama-type-tag.type-3d {
    background: rgba(16, 185, 129, 0.2);
    color: #6EE7B7;
  }
  .drama-type-tag.type-emoji {
    background: rgba(251, 191, 36, 0.2);
    color: #FCD34D;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px;
    max-width: 900px;
    width: 95%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--border);
  }

  .modal h2 {
    font-size: 20px;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .form-group select,
  .form-group input,
  .form-group textarea {
    width: 100%;
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }

  .form-group textarea {
    height: 300px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .paste-hint {
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #A78BFA;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* 编辑按钮 */
  .edit-btn {
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    background: none;
    border: none;
    color: var(--text-muted);
  }
  .edit-btn:hover { color: #8B5CF6; background: rgba(139,92,246,0.12); }
  tr:hover .edit-btn { opacity: 1; }

  /* 编辑弹窗 */
  .edit-modal {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 520px;
    width: 95%;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .edit-modal h3 {
    font-size: 18px;
    margin: 0 0 6px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edit-modal .edit-drama-name {
    color: #A78BFA;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .edit-modal .edit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .edit-modal .edit-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .edit-modal .edit-field.full-width {
    grid-column: 1 / -1;
  }
  .edit-modal .edit-field label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .edit-modal .edit-field input,
  .edit-modal .edit-field select,
  .edit-modal .edit-field textarea {
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .edit-modal .edit-field input:focus,
  .edit-modal .edit-field select:focus,
  .edit-modal .edit-field textarea:focus {
    outline: none;
    border-color: #8B5CF6;
  }
  .edit-modal .edit-field textarea {
    height: 60px;
    resize: vertical;
  }
  .edit-modal .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .edit-modal .edit-actions .btn { min-width: 80px; text-align: center; }

  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .no-data-icon { font-size: 48px; margin-bottom: 16px; }
  .no-data-text { font-size: 16px; }

  .available-dates {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .date-chip {
    padding: 6px 14px;
    background: #2a2a3e;
    border: 1px solid #3a3a4e;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-muted);
  }

  .date-chip:hover { border-color: #8B5CF6; color: #8B5CF6; }
  .date-chip.active { background: #8B5CF6; border-color: #8B5CF6; color: white; }
  .date-chip.active-hongguo { background: var(--hongguo-primary); border-color: var(--hongguo-primary); color: white; }
  .date-chip.active-hongguo:hover { border-color: var(--hongguo-primary); color: white; }

  /* Copilot 样式 */
  .copilot-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(139,92,246,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 900;
    transition: all 0.3s;
    animation: copilotPulse 2s ease-in-out infinite;
  }

  .copilot-fab:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(139,92,246,0.6);
  }

  .copilot-fab svg { width: 26px; height: 26px; fill: white; }

  @keyframes copilotPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(139,92,246,0.4); }
    50% { box-shadow: 0 4px 28px rgba(236,72,153,0.5); }
  }

  .copilot-panel {
    position: fixed;
    top: 0; right: -420px; bottom: 0;
    width: 420px;
    background: #12121f;
    border-left: 1px solid #2a2a3e;
    z-index: 950;
    display: flex;
    flex-direction: column;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -8px 0 32px rgba(0,0,0,0.5);
  }

  .copilot-panel.open { right: 0; }

  .copilot-header {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2a2a3e;
    background: rgba(26,26,46,0.8);
    backdrop-filter: blur(12px);
  }

  .copilot-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .copilot-header-icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, #8B5CF6, #EC4899);
    display: flex; align-items: center; justify-content: center;
  }

  .copilot-header-icon svg { width: 18px; height: 18px; fill: white; }

  .copilot-header-title {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, #A78BFA, #F472B6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .copilot-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 20px; padding: 4px 8px;
    border-radius: 6px; transition: all 0.2s;
  }

  .copilot-close:hover { background: rgba(255,255,255,0.08); color: white; }

  .copilot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .copilot-msg {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 13.5px;

function loadAllData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch(e) {}
  }
  const defaultData = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
  return defaultData;
}

function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  checkSyncStatus();
}

// ============ GitHub 同步功能 ============
const GITHUB_TOKEN_KEY = 'manju_github_token';
const GITHUB_OWNER = 'bilinsandrali-cpu';
const GITHUB_REPO = 'Sandra';
const GITHUB_FILE_PATH = 'index.html';
const GITHUB_BRANCH = 'main';

function getGitHubToken() {
  return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
}

function saveGitHubToken() {
  const token = document.getElementById('syncToken').value.trim();
  if (!token) { alert('请输入 Token'); return; }
  localStorage.setItem(GITHUB_TOKEN_KEY, token);
  showSyncReady();
}

function showTokenSetup() {
  document.getElementById('syncSetup').style.display = '';
  document.getElementById('syncReady').style.display = 'none';
  document.getElementById('syncProgress').style.display = 'none';
  document.getElementById('syncToken').value = getGitHubToken();
}

function showSyncPanel() {
  document.getElementById('syncModal').classList.add('show');
  if (!getGitHubToken()) {
    showTokenSetup();
  } else {
    showSyncReady();
  }
}

function closeSyncPanel() {
  document.getElementById('syncModal').classList.remove('show');
}

function showSyncReady() {
  document.getElementById('syncSetup').style.display = 'none';
  document.getElementById('syncReady').style.display = '';
  document.getElementById('syncProgress').style.display = 'none';
  renderDiffPreview();
}

function checkSyncStatus() {
  const btn = document.getElementById('syncBtn');
  if (!btn) return;
  const defaultData = getDefaultData();
  const currentJson = JSON.stringify(allData);
  const defaultJson = JSON.stringify(defaultData);
  if (currentJson !== defaultJson) {
    btn.classList.add('has-changes');
    btn.title = '有未同步的修改，点击推送到 GitHub';
  } else {
    btn.classList.remove('has-changes');
    btn.title = '同步到 GitHub';
  }
}

function renderDiffPreview() {
  const area = document.getElementById('syncDiffArea');
  const defaultData = getDefaultData();
  const diffs = [];

  for (const [date, dayData] of Object.entries(allData)) {
    for (const platform of ['douyin', 'hongguo']) {
      const cur = dayData && dayData[platform];
      const def = defaultData[date] && defaultData[date][platform];

      // 新增的日期/平台
      if (cur && cur.items && cur.items.length > 0 && (!def || !def.items || def.items.length === 0)) {
        diffs.push({ type: 'add', date, platform, desc: `新增 ${cur.items.length} 条数据` });
        continue;
      }
      if (!cur || !cur.items || !def || !def.items) continue;

      // 逐条对比
      const maxLen = Math.max(cur.items.length, def.items.length);
      for (let i = 0; i < maxLen; i++) {
        const ci = cur.items[i];
        const di = def.items[i];
        if (!ci && di) {
          diffs.push({ type: 'remove', date, platform, desc: `#${di.rank} ${di.name} 已删除` });
        } else if (ci && !di) {
          diffs.push({ type: 'add', date, platform, desc: `#${ci.rank} ${ci.name} 新增` });
        } else if (ci && di) {
          const changes = [];
          for (const key of Object.keys(ci)) {
            if (String(ci[key]) !== String(di[key])) {
              changes.push(`${key}: ${di[key]} → ${ci[key]}`);
            }
          }
          if (changes.length > 0) {
            diffs.push({ type: 'change', date, platform, rank: ci.rank, name: ci.name || di.name, changes });
          }
        }
      }
    }
  }

  if (diffs.length === 0) {
    area.innerHTML = '<div class="diff-summary">✅ 本地数据和源文件一致，无需同步。</div>';
    document.getElementById('syncPushBtn').disabled = true;
    document.getElementById('syncPushBtn').style.opacity = '0.5';
    return;
  }

  document.getElementById('syncPushBtn').disabled = false;
  document.getElementById('syncPushBtn').style.opacity = '';

  let html = `<div class="diff-summary">📝 发现 <strong>${diffs.length}</strong> 处改动</div>`;
  const grouped = {};
  for (const d of diffs) {
    const key = `${d.date} ${d.platform === 'douyin' ? '🎵抖音' : '🍎红果'}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(d);
  }
  for (const [section, items] of Object.entries(grouped)) {
    html += `<div class="diff-section">${section}</div>`;
    for (const item of items) {
      if (item.type === 'add') {
        html += `<div class="diff-add">+ ${item.desc}</div>`;
      } else if (item.type === 'remove') {
        html += `<div class="diff-remove">- ${item.desc}</div>`;
      } else if (item.type === 'change') {
        html += `<div class="diff-add">~ #${item.rank} ${item.name}</div>`;

function serializeDataBlock(data) {
  // 把 allData 序列化成和源文件一致的 JS 对象字面量格式
  const lines = [];
  const dates = Object.keys(data).sort().reverse();
  for (const date of dates) {
    const dayData = data[date];
    lines.push(`"${date}": {`);

    for (const platform of ['douyin', 'hongguo']) {
      const pData = dayData[platform];
      if (!pData || !pData.items || pData.items.length === 0) {
        lines.push(`      ${platform}: null${platform === 'douyin' ? ',' : ''}`);
        continue;
      }
      lines.push(`      ${platform}: {`);
      lines.push(`        date: "${pData.date}",`);
      lines.push(`        items: [`);

      for (let i = 0; i < pData.items.length; i++) {
        const item = pData.items[i];
        const comma = i < pData.items.length - 1 ? ',' : '';
        if (platform === 'douyin') {
          const parts = [
            `rank:${item.rank}`,
            `name:${JSON.stringify(item.name)}`,
            `account:${JSON.stringify(item.account || '')}`,
            `affiliate:${JSON.stringify(item.affiliate || '')}`,
            `episodes:${item.episodes || 0}`,
            `type:${JSON.stringify(item.type || '')}`,
            `newPlay:${JSON.stringify(item.newPlay || '')}`,
            `totalPlay:${JSON.stringify(item.totalPlay || '')}`,
            `synopsis:${JSON.stringify(item.synopsis || '')}`
          ];
          lines.push(`          {${parts.join(', ')}}${comma}`);
        } else {
          const parts = [
            `rank:${item.rank}`,
            `name:${JSON.stringify(item.name)}`,
            `tags:${JSON.stringify(item.tags || '')}`,
            `publisher:${JSON.stringify(item.publisher || '')}`,
            `onlineDate:${JSON.stringify(item.onlineDate || '')}`,
            `episodes:${item.episodes || 0}`,
            `type:${JSON.stringify(item.type || '')}`,
            `hotValue:${JSON.stringify(item.hotValue || '')}`,
            `synopsis:${JSON.stringify(item.synopsis || '')}`
          ];
          lines.push(`          {${parts.join(', ')}}${comma}`);
        }
      }

      lines.push(`        ]`);
      lines.push(`      }${platform === 'douyin' ? ',' : ''}`);
    }

    const isLast = date === dates[dates.length - 1];
    lines.push(`    }${isLast ? '' : ','}`);
  }
  return lines.join('\n');
}

async function pushToGitHub() {
  const token = getGitHubToken();
  if (!token) { showTokenSetup(); return; }

  document.getElementById('syncReady').style.display = 'none';
  document.getElementById('syncProgress').style.display = '';
  setSyncProgress(10, '正在获取最新文件...');

  try {
    // Step 1: 获取当前文件的 sha 和内容
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}?ref=${GITHUB_BRANCH}`,
      { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (!getResp.ok) {
      if (getResp.status === 401) throw new Error('Token 无效或已过期，请重新配置');
      if (getResp.status === 404) throw new Error('仓库或文件不存在');
      throw new Error(`GitHub API 错误: ${getResp.status}`);
    }
    const fileInfo = await getResp.json();
    const sha = fileInfo.sha;
    setSyncProgress(30, '正在解码文件内容...');

    // Step 2: 解码文件内容
    const content = decodeURIComponent(escape(atob(fileInfo.content.replace(/\n/g, ''))));
    setSyncProgress(50, '正在替换数据...');

    // Step 3: 替换数据块
    const marker = 'function getDefaultData() {';
    const dataBlockStart = content.indexOf(marker);
    if (dataBlockStart === -1) throw new Error('无法在源文件中找到数据块');

    const returnIdx = content.indexOf('return {', dataBlockStart);
    if (returnIdx === -1) throw new Error('无法找到 return 语句');
    const afterReturn = content.indexOf('\n', returnIdx) + 1; // "return {\n" 之后的位置

    // 找 getDefaultData 函数结束后紧跟的 loadAllData 函数作为锚点
    const endAnchor = 'function loadAllData()';
    const endIdx = content.indexOf(endAnchor, afterReturn);
    if (endIdx === -1) throw new Error('无法找到数据块结束锚点');

    const newDataBlock = serializeDataBlock(allData);
    const newContent = content.substring(0, afterReturn) + newDataBlock + '\n  };\n}\n\n' + content.substring(endIdx);

    // 更新 CURRENT_BUILD 版本号（用当前时间戳）
    const buildTs = new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14);
    const finalContent = newContent.replace(/CURRENT_BUILD\s*=\s*"[^"]*"/, `CURRENT_BUILD = "20260323123713"`);

    setSyncProgress(70, '正在推送到 GitHub...');

    // Step 4: 推送更新
    const encoded = btoa(unescape(encodeURIComponent(finalContent)));
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`,
      {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `sync: 从网页同步数据更新 (${new Date().toLocaleString('zh-CN')})`,
          content: encoded,
          sha: sha,
          branch: GITHUB_BRANCH
        })
      }
    );

    if (!putResp.ok) {
      const errBody = await putResp.text();
      if (putResp.status === 409) throw new Error('文件冲突，请刷新页面后重试');
      if (putResp.status === 422) throw new Error('文件内容编码错误');
      throw new Error(`推送失败: ${putResp.status} ${errBody.substring(0, 100)}`);
    }

    setSyncProgress(100, '✅ 同步成功！GitHub Pages 将在 1-2 分钟后自动更新', 'sync-success');

    // 同步成功后更新按钮状态
    document.getElementById('syncBtn').classList.remove('has-changes');

    // 3秒后关闭
    setTimeout(() => {
      closeSyncPanel();
      document.getElementById('syncProgress').style.display = 'none';
    }, 3000);

  } catch (err) {
    setSyncProgress(0, '❌ ' + err.message, 'sync-error');
    // 显示重试按钮
    setTimeout(() => {
      document.getElementById('syncProgress').style.display = 'none';
      showSyncReady();
    }, 3000);
  }
}

    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}" ${String(val) === o ? 'selected' : ''}>${o}</option>`).join('');
      // 如果当前值不在预设选项中，添加为第一项
      const hasVal = f.options.includes(String(val));
      const extraOpt = (!hasVal && val) ? `<option value="${val}" selected>${val}</option>` : '';
      input = `<select id="edit_${f.key}">${extraOpt}${opts}</select>`;
    } else if (f.type === 'textarea') {
      input = `<textarea id="edit_${f.key}">${val}</textarea>`;

function parseAndSave() {
  const date = document.getElementById('modalDate').value;
  const type = document.getElementById('modalType').value;
  const raw = document.getElementById('modalData').value.trim();
  if (!date) { alert('请选择日期'); return; }
  if (!raw) { alert('请粘贴数据'); return; }
  const lines = raw.split('\n').filter(l => l.trim());
  const items = [];
  for (const line of lines) {
    const parts = line.includes('|') ? line.split('|').map(s => s.trim()) : line.split('\t').map(s => s.trim());
    if (type === 'douyin') {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], account: parts[2] || '', affiliate: parts[3] || '', episodes: parseInt(parts[4]) || 0, type: parts[5] || '', newPlay: parts[6] || '', totalPlay: parts[7] || '' });
      }
    } else {
      if (parts.length >= 2) {
        items.push({ rank: parseInt(parts[0]) || items.length + 1, name: parts[1], tags: parts[2] || '', publisher: parts[3] || '', onlineDate: parts[4] || '', episodes: parseInt(parts[5]) || 0, hotValue: parts[6] || '' });
      }
    }
  }
  if (items.length === 0) { alert('未能解析出有效数据，请检查格式'); return; }
  if (!allData[date]) { allData[date] = { douyin: null, hongguo: null }; }
  const formattedDate = date.replace(/-/g, '/').replace(/^(\d{4})\/0?(\d+)\/0?(\d+)$/, '$1/$2/$3');
  if (type === 'douyin') { allData[date].douyin = { date: formattedDate, items }; }
  else { allData[date].hongguo = { date: formattedDate, items }; }
  saveAllData(allData);
  alert(`✅ 成功保存 ${items.length} 条${type === 'douyin' ? '抖音' : '红果'}榜数据！`);
  closeModal();
  document.getElementById('modalData').value = '';
  loadDate(date);
}

  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      for (const [date, data] of Object.entries(imported)) {
        if (!allData[date]) { allData[date] = data; }
        else { if (data.douyin) allData[date].douyin = data.douyin; if (data.hongguo) allData[date].hongguo = data.hongguo; }

      saveAllData(allData);
      alert('✅ 导入成功！');
      init();
    } catch(e) { alert('❌ 导入失败：JSON格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function escapeCSV(val) {
  const s = String(val == null ? '' : val);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) { return '"' + s.replace(/"/g, '""') + '"'; }
  return s;
}

function downloadCSV(filename, csvContent) {
  const bom = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}

let copilotProcessing = false;

async function askCopilot(question) {
  if (copilotProcessing) return;
  addUserMessage(question);
  showTyping();
  
  const settings = getAISettings();
  
  if (settings.workerUrl) {
    // AI 增强模式：先尝试 Worker AI
    copilotProcessing = true;
    try {
      const aiResult = await callWorkerAI(question, settings);
      removeTyping();
      const source = `via ${aiResult.model || settings.provider}` + 
        (aiResult.usage ? ` · ${aiResult.usage.total_tokens} tokens` : '');
      addBotMessage(formatAIResponse(aiResult.content) + `<br><span class="ai-source">— ${source}</span>`);
      showSuggestions(['继续深入分析', '换个角度看', '对比其他平台']);
    } catch (aiErr) {
      console.warn('AI call failed, falling back to local engine:', aiErr);
      removeTyping();
      // Fallback 到本地引擎
      const answer = analyzeQuestion(question);
      addBotMessage(answer.html + `<br><span class="ai-source">⚠️ AI 调用失败（${aiErr.message}），已使用本地引擎回答</span>`);
      if (answer.suggestions) showSuggestions(answer.suggestions);
      else showSuggestions(['Top10 题材变化', '新上榜作品', '版权方排名', '跨平台对比']);
    } finally {
      copilotProcessing = false;
    }
  } else {
    // 纯本地引擎模式
    setTimeout(() => {
      removeTyping();
      const answer = analyzeQuestion(question);
      addBotMessage(answer.html);
      if (answer.suggestions) showSuggestions(answer.suggestions);
      else showSuggestions(['Top10 题材变化', '新上榜作品', '版权方排名', '跨平台对比']);
    }, 400 + Math.random() * 300);
  }
}

async function callWorkerAI(question, settings) {
  const context = getCurrentDataContext();
  
  let dataDesc = '';
  for (const date of context.dates) {
    const d = context.data[date];
    if (d.douyin) {
      dataDesc += `\n📊 抖音漫剧热播榜（${date}）TOP${d.douyin.length}：\n${JSON.stringify(d.douyin, null, 2)}\n`;
    }
    if (d.hongguo) {
      dataDesc += `\n📊 红果漫剧热播榜（${date}）TOP${d.hongguo.length}：\n${JSON.stringify(d.hongguo, null, 2)}\n`;
    }
  }
  if (!dataDesc) dataDesc = '（当前无榜单数据）';

  const systemPrompt = `你是"漫剧有数"数据分析助手。你需要基于以下榜单数据回答用户的问题。

可用数据日期：${context.dates.join(', ')}
${dataDesc}

回答要求：
1. 回答简洁有条理，善用数据佐证
2. 如果数据中没有相关信息，如实说明
3. 适当使用 emoji 让回答更易读
4. 播放量/热度值带上单位
5. 对比分析时标注数据来源（抖音榜/红果榜）
6. 用 Markdown 格式（**加粗**、列表等）`;

  const body = {
    provider: settings.provider || 'openai',
    model: settings.model || undefined,
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: question }
    ]
  };

  const response = await fetch(settings.workerUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`Worker ${response.status}: ${err.substring(0, 100)}`);
  }

  const data = await response.json();
  if (!data.success) throw new Error(data.error || '未知错误');
  return { content: data.content, model: data.model, usage: data.usage };
}

function formatAIResponse(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// ---- 智能意图解析工具函数 ----

// 从问题中解析平台意图
function parsePlatformIntent(ql) {
  const mentionDouyin = ql.includes('抖音') || ql.includes('douyin');
  const mentionHongguo = ql.includes('红果') || ql.includes('hongguo');
  if (mentionDouyin && mentionHongguo) return 'both';
  if (mentionDouyin) return 'douyin';
  if (mentionHongguo) return 'hongguo';
  return 'all'; // 未指定 → 默认分析全部
}

function platformLabel(platform) {
  if (platform === 'douyin') return '🎵 抖音榜';
  if (platform === 'hongguo') return '🍎 红果榜';
  if (platform === 'both') return '🎵 抖音榜 + 🍎 红果榜';
  return '🎵 抖音榜 + 🍎 红果榜（全平台）';
}

// 从问题中解析排名范围（前N名）
function parseRankLimit(ql) {
  const patterns = [
    /前(\d+)/,
    /top\s*(\d+)/i,
    /前(\d+)名/,
    /top(\d+)/i,
    /(\d+)名以内/,
    /排名(\d+)以内/
  ];
  for (const p of patterns) {
    const m = ql.match(p);
    if (m) return parseInt(m[1]);
  }
  return 30; // 默认全部 Top30
}

// 从问题中解析时间范围
function parseDateRange(ql, allDates) {
  if (allDates.length === 0) return { dates: [], label: '无数据' };

  if (ql.includes('今天') || ql.includes('今日') || ql.includes('最新')) {
    return { dates: [allDates[0]], label: allDates[0] };
  }
  if (ql.includes('昨天') || ql.includes('昨日')) {
    if (allDates.length >= 2) return { dates: [allDates[1]], label: allDates[1] };
    return { dates: [allDates[0]], label: allDates[0] + '（仅有最新一天数据）' };
  }
  // 匹配具体日期 如 3/19、03-19、2026-03-19
  const dateMatch = ql.match(/(\d{4}[-/])?\d{1,2}[-/]\d{1,2}/);
  if (dateMatch) {
    let ds = dateMatch[0].replace(/\//g, '-');
    if (!ds.match(/^\d{4}/)) ds = new Date().getFullYear() + '-' + ds;
    ds = ds.replace(/-(\d)(?=-|$)/g, '-0$1'); // 补零
    const found = allDates.find(d => d === ds);
    if (found) return { dates: [found], label: found };
  }
  // 最近N天
  const recentMatch = ql.match(/最近(\d+)天/);
  if (recentMatch) {
    const n = Math.min(parseInt(recentMatch[1]), allDates.length);
    const subset = allDates.slice(0, n);
    return { dates: subset, label: `最近 ${n} 天（${subset[subset.length - 1]} ~ ${subset[0]}）` };
  }

  // 默认：全部日期
  return {
    dates: allDates,
    label: allDates.length === 1 ? allDates[0] : `全部 ${allDates.length} 天（${allDates[allDates.length - 1]} ~ ${allDates[0]}）`
  };
}

// 生成数据来源标签（每条回答开头都显示）
function sourceTag(platformStr, dateLabel, rankLimit) {
  let tag = `<div style="background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:12px;color:#A78BFA;">`;
  tag += `📋 数据范围：${platformStr}`;
  if (rankLimit < 30) tag += ` | 排名前 ${rankLimit}`;
  tag += ` | ${dateLabel}`;
  tag += `</div>`;
  return tag;
}

// 核心分析函数
function analyzeQuestion(q) {
  const dates = getAvailableDates();
  const ql = q.toLowerCase();
  const platform = parsePlatformIntent(ql);
  const rankLimit = parseRankLimit(ql);
  const dateRange = parseDateRange(ql, dates);

  // 制作类型分布 — 必须在"题材"之前匹配，避免"制作类型分布"被"类型分布"误匹配
  if (ql.includes('制作类型') || ql.includes('ai仿真') || ql.includes('2d') || ql.includes('3d') || ql.includes('表情包')) {
    return analyzeProductionType(dateRange, platform, rankLimit);
  }

  // 题材/标签分析（仅红果榜有题材标签数据，抖音没有）
  if (ql.includes('题材') || ql.includes('标签') || ql.includes('类型分布') || ql.includes('tag') || ql.includes('分类') || ql.includes('类别')) {
    // 如果用户指定了抖音，提示抖音无此数据
    if (platform === 'douyin') {
      return {
        html: '⚠️ 抖音榜暂无题材标签数据，题材/标签分析仅支持<strong>红果榜</strong>。<br><br>💡 你可以试试：<br>• "红果题材分布" — 查看红果榜题材标签分布<br>• "制作类型分布" — 查看制作类型（AI仿真人/2D/3D/表情包），红果和抖音都有',
        suggestions: ['红果前10题材分布', '红果制作类型分布', '跨平台对比', '版权方排名']
      };
    }
    return analyzeGenres(dateRange, ql, platform, rankLimit);
  }

  // 跨平台对比 — 强制使用 both
  if ((ql.includes('抖音') && ql.includes('红果')) || ql.includes('都上榜') || ql.includes('跨平台') || ql.includes('两个平台')) {
    return analyzeCrossPlatform(dateRange);
  }

  // 新上榜分析
  if (ql.includes('新上榜') || ql.includes('新作') || ql.includes('新入榜') || ql.includes('新剧')) {
    return analyzeNewEntries(dates, platform);
  }

  // 版权方/出品方分析
  if (ql.includes('版权') || ql.includes('出品') || ql.includes('publisher') || ql.includes('制作方')) {
    return analyzePublishers(dateRange, platform, rankLimit);
  }

  // 热度/播放量最高
  if (ql.includes('热度最高') || ql.includes('最热') || ql.includes('播放最高') || ql.includes('top1') || ql.includes('榜首')) {
    return analyzeTopPerformers(dateRange, platform);
  }

  // 排名变化
  if (ql.includes('排名变化') || ql.includes('上升') || ql.includes('下降') || ql.includes('排名')) {
    return analyzeRankChanges(dates, platform);
  }

  // 账号分析（抖音）
  if (ql.includes('账号') || ql.includes('发布者') || ql.includes('account')) {
    return analyzeAccounts(dateRange, rankLimit);
  }

  // 集数分析
  if (ql.includes('集数') || ql.includes('最长') || ql.includes('最短') || ql.includes('episode')) {
    return analyzeEpisodes(dateRange, platform, rankLimit);
  }

  // 概览/总结
  if (ql.includes('概览') || ql.includes('总结') || ql.includes('概况') || ql.includes('数据量') || ql.includes('有多少')) {
    return analyzeOverview(dates);
  }

  // 具体作品查询
  const matchedDrama = findDramaByName(q, dates);
  if (matchedDrama) {
    return analyzeDrama(matchedDrama, dates);
  }

  // 默认：智能概览
  return {
    html: `我可以帮你分析以下方面的数据：<br><br>
      📊 <strong>题材趋势</strong> — 各标签/类型的上榜分布和变化<br>
      🔄 <strong>跨平台对比</strong> — 同时出现在抖音和红果的作品<br>
      🆕 <strong>新上榜作品</strong> — 当天新进入榜单的作品<br>
      🏢 <strong>版权方分析</strong> — 出品方/版权方的上榜数量<br>
      📈 <strong>排名变化</strong> — 作品在不同日期的排名变动<br>
      🎬 <strong>作品查询</strong> — 直接输入剧名查看详情<br>
      🎨 <strong>制作类型</strong> — AI仿真人/2D/3D/表情包分布<br><br>
      💡 <strong>高级用法</strong>：可以限定平台和范围，如：<br>
      &nbsp;&nbsp;• "红果榜前10题材分布"<br>
      &nbsp;&nbsp;• "抖音榜前20排名变化"<br>
      &nbsp;&nbsp;• "红果前5版权方"<br>`,
    suggestions: ['红果前10题材分布', '红果制作类型分布', '跨平台对比', '版权方排名', '集数分析', '数据概况']
  };
}

function analyzeGenres(dateRange, ql, platform, rankLimit) {
  const genreMap = {};
  const dateGenres = {};
  const pLabel = platformLabel(platform);

  for (const date of dateRange.dates) {
    const dayData = allData[date] || {};
    dateGenres[date] = {};

    // 红果标签（仅红果榜有题材标签，抖音没有此字段）
    if (dayData.hongguo && dayData.hongguo.items) {
      const items = dayData.hongguo.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        const tags = (item.tags || '').split('/').map(t => t.trim()).filter(Boolean);
        for (const tag of tags) {
          genreMap[tag] = (genreMap[tag] || 0) + 1;
          dateGenres[date][tag] = (dateGenres[date][tag] || 0) + 1;
        }
      }
    }
  }

  const sorted = Object.entries(genreMap).sort((a, b) => b[1] - a[1]);
  const top10 = sorted.slice(0, 10);
  const totalTags = sorted.reduce((s, e) => s + e[1], 0);

  let html = sourceTag('🍎 红果榜', dateRange.label, rankLimit);
  html += `<strong>📊 红果榜题材/标签 Top 10 分布</strong><br><br>`;
  if (top10.length === 0) {
    html += '暂无题材标签数据。<br><br>💡 题材/标签分析仅支持红果榜。';
    return { html, suggestions: ['红果制作类型分布', '跨平台对比', '版权方排名'] };
  }
  top10.forEach((item, i) => {
    const pct = totalTags > 0 ? Math.round(item[1] / totalTags * 100) : 0;
    const bar = '█'.repeat(Math.min(Math.ceil(item[1] / 2), 15));
    html += `${i + 1}. <span class="tag">${item[0]}</span> — 出现 <span class="num">${item[1]}</span> 次（${pct}%） <span style="color:#8B5CF6;font-size:11px">${bar}</span><br>`;
  });

  // 变化趋势
  if (dateRange.dates.length >= 2) {
    const latest = dateRange.dates[0];
    const prev = dateRange.dates[1];
    const latestTags = dateGenres[latest] || {};
    const prevTags = dateGenres[prev] || {};

    const rising = [];
    const falling = [];
    const allTags = new Set([...Object.keys(latestTags), ...Object.keys(prevTags)]);

    for (const tag of allTags) {
      const diff = (latestTags[tag] || 0) - (prevTags[tag] || 0);
      if (diff > 0) rising.push({ tag, diff });
      else if (diff < 0) falling.push({ tag, diff: Math.abs(diff) });
    }

    rising.sort((a, b) => b.diff - a.diff);
    falling.sort((a, b) => b.diff - a.diff);

    if (rising.length > 0 || falling.length > 0) {
      html += `<br><strong>📈 最近趋势</strong>（${prev} → ${latest}）<br>`;
      if (rising.length > 0) {
        html += `🔺 热度上升：${rising.slice(0, 5).map(r => `<span class="tag">${r.tag}</span> +${r.diff}`).join('、')}<br>`;
      }
      if (falling.length > 0) {
        html += `🔻 热度下降：${falling.slice(0, 5).map(r => `<span class="tag">${r.tag}</span> -${r.diff}`).join('、')}<br>`;
      }
    }
  }

  return { html, suggestions: ['红果前10题材分布', '红果制作类型分布', '新上榜作品', '版权方排名'] };
}

function analyzeCrossPlatform(dateRange) {

    const douyinNames = new Set(dayData.douyin.items.map(i => i.name));
    const hongguoNames = new Set(dayData.hongguo.items.map(i => i.name));

function analyzeEpisodes(dateRange, platform, rankLimit) {
  const allEpisodes = [];
  const pLabel = platformLabel(platform);

  for (const date of dateRange.dates) {
    const dayData = allData[date] || {};
    if ((platform === 'all' || platform === 'hongguo' || platform === 'both') && dayData.hongguo && dayData.hongguo.items) {
      const items = dayData.hongguo.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        allEpisodes.push({ name: item.name, episodes: item.episodes, platform: '红果', date });
      }
    }
    if ((platform === 'all' || platform === 'douyin' || platform === 'both') && dayData.douyin && dayData.douyin.items) {
      const items = dayData.douyin.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        allEpisodes.push({ name: item.name, episodes: item.episodes, platform: '抖音', date });
      }
    }
  }

  // 去重
  const seen = new Set();
  const unique = allEpisodes.filter(e => {
    const key = e.name + e.platform;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  unique.sort((a, b) => b.episodes - a.episodes);
  const longest = unique.slice(0, 5);
  const shortest = [...unique].sort((a, b) => a.episodes - b.episodes).slice(0, 5);

  const avg = unique.length > 0 ? Math.round(unique.reduce((s, e) => s + e.episodes, 0) / unique.length) : 0;

  let html = sourceTag(pLabel, dateRange.label, rankLimit);
  html += `<strong>🎬 集数分析</strong><br><br>`;
  html += `平均集数：<span class="num">${avg}</span> 集<br><br>`;

  html += '📏 <strong>集数最多</strong>：<br>';
  longest.forEach(e => {
    html += `&nbsp;&nbsp;• <span class="highlight">${e.name}</span> — <span class="num">${e.episodes}</span> 集（${e.platform}）<br>`;
  });

  html += '<br>📐 <strong>集数最少</strong>：<br>';
  shortest.forEach(e => {
    html += `&nbsp;&nbsp;• <span class="highlight">${e.name}</span> — <span class="num">${e.episodes}</span> 集（${e.platform}）<br>`;
  });

  return { html, suggestions: ['题材分布', '版权方排名', '热度最高作品'] };
}

function analyzeProductionType(dateRange, platform, rankLimit) {
  const typeMap = {};
  const dateTypes = {};
  const includeHongguo = platform === 'all' || platform === 'hongguo' || platform === 'both';
  const includeDouyin = platform === 'all' || platform === 'douyin' || platform === 'both';

  for (const date of dateRange.dates) {
    const dayData = allData[date] || {};
    dateTypes[date] = {};
    // 红果
    if (includeHongguo && dayData.hongguo && dayData.hongguo.items) {
      const items = dayData.hongguo.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        const t = item.type || '未分类';
        typeMap[t] = (typeMap[t] || 0) + 1;
        dateTypes[date][t] = (dateTypes[date][t] || 0) + 1;
      }
    }
    // 抖音
    if (includeDouyin && dayData.douyin && dayData.douyin.items) {
      const items = dayData.douyin.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        const t = (item.type || '').trim();
        if (t && t !== '0') {
          typeMap[t] = (typeMap[t] || 0) + 1;
          dateTypes[date][t] = (dateTypes[date][t] || 0) + 1;
        }
      }
    }
  }

  const sorted = Object.entries(typeMap).sort((a, b) => b[1] - a[1]);
  const total = sorted.reduce((s, e) => s + e[1], 0);
  const colorMap = {'AI仿真人': '#C4B5FD', '2D': '#93C5FD', '3D': '#6EE7B7', '表情包': '#FCD34D'};

  // 根据实际平台生成标题
  const pLabel = (includeHongguo && includeDouyin) ? '🍎🎵 红果+抖音'
    : includeHongguo ? '🍎 红果榜'
    : '🎵 抖音榜';
  const titleSuffix = (includeHongguo && includeDouyin) ? '（双平台）' : '';

  let html = sourceTag(pLabel, dateRange.label, rankLimit);
  html += `<strong>🎨 制作类型分布${titleSuffix}</strong><br><br>`;

  if (sorted.length === 0) {
    html += '暂无制作类型数据。';
    return { html, suggestions: ['红果制作类型分布', '跨平台对比', '版权方排名'] };
  }

  sorted.forEach((item, i) => {
    const [name, count] = item;
    const pct = total > 0 ? Math.round(count / total * 100) : 0;
    const bar = '█'.repeat(Math.min(Math.ceil(count / 2), 15));
    const color = colorMap[name] || '#888';
    html += `${i + 1}. <span style="color:${color};font-weight:600">${name}</span> — <span class="num">${count}</span> 条（${pct}%） <span style="color:${color};font-size:11px">${bar}</span><br>`;
  });

  // 各类型代表作
  html += '<br><strong>各类型代表作品：</strong><br>';
  const typeDramas = {};
  const showPlatformTag = includeHongguo && includeDouyin;
  for (const date of dateRange.dates) {
    const dayData = allData[date] || {};
    if (includeHongguo && dayData.hongguo && dayData.hongguo.items) {
      const items = dayData.hongguo.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        const t = item.type || '未分类';
        if (!typeDramas[t]) typeDramas[t] = new Set();
        typeDramas[t].add(item.name + (showPlatformTag ? '（红果）' : ''));
      }
    }
    if (includeDouyin && dayData.douyin && dayData.douyin.items) {
      const items = dayData.douyin.items.filter(i => i.rank <= rankLimit);
      for (const item of items) {
        const t = (item.type || '').trim();
        if (t && t !== '0') {
          if (!typeDramas[t]) typeDramas[t] = new Set();
          typeDramas[t].add(item.name + (showPlatformTag ? '（抖音）' : ''));
        }
      }
    }
  }
  for (const [type, dramas] of Object.entries(typeDramas)) {
    const color = colorMap[type] || '#888';
    const list = [...dramas].slice(0, 4).join('、');
    html += `&nbsp;&nbsp;<span style="color:${color}">${type}</span>：${list}<br>`;
  }

  // 日间变化
  if (dateRange.dates.length >= 2) {
    const latest = dateRange.dates[0];
    const prev = dateRange.dates[1];
    html += `<br><strong>📈 类型变化</strong>（${prev} → ${latest}）<br>`;
    const allTypes = new Set([...Object.keys(dateTypes[latest] || {}), ...Object.keys(dateTypes[prev] || {})]);
    for (const t of allTypes) {
      const cur = (dateTypes[latest] || {})[t] || 0;
      const pre = (dateTypes[prev] || {})[t] || 0;
      const diff = cur - pre;
      if (diff !== 0) {
        const color = colorMap[t] || '#888';
        const arrow = diff > 0 ? '🔺' : '🔻';
        html += `&nbsp;&nbsp;${arrow} <span style="color:${color}">${t}</span>：${pre} → ${cur}（${diff > 0 ? '+' : ''}${diff}）<br>`;
      }
    }
  }

  return { html, suggestions: ['红果前10题材分布', '版权方排名', '跨平台对比'] };
}

  html += `📊 总数据量：<span class="num">${totalDouyin + totalHongguo}</span> 条<br><br>`;

  html += '<strong>各日期数据情况：</strong><br>';
  for (const date of dates) {
    const dayData = allData[date] || {};
    const dy = dayData.douyin ? `抖音 ${dayData.douyin.items.length} 条` : '抖音 ❌';
    const hg = dayData.hongguo ? `红果 ${dayData.hongguo.items.length} 条` : '红果 ❌';
    html += `&nbsp;&nbsp;${date}：${dy} | ${hg}<br>`;
  }

  return { html, suggestions: ['题材分布', '版权方排名', '新上榜作品', '热度最高作品'] };
}

function findDramaByName(query, dates) {
  const q = query.replace(/[？?。，,！!]/g, '').trim();
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => q.includes(i.name) || i.name.includes(q));
      if (found) return { ...found, platform: 'douyin', date };
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => q.includes(i.name) || i.name.includes(q));
      if (found) return { ...found, platform: 'hongguo', date };
    }
  }
  return null;
}

function analyzeDrama(drama, dates) {
  let html = `<strong>🎬 「${drama.name}」详情</strong><br><br>`;

  // 查找简介
  let synopsis = '';
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => i.name === drama.name);
      if (found && found.synopsis) { synopsis = found.synopsis; break; }
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => i.name === drama.name);
      if (found && found.synopsis) { synopsis = found.synopsis; break; }
    }
  }

  if (synopsis) {
    html += `📝 <strong>简介：</strong>${synopsis}<br><br>`;
  }

  // 在所有日期中查找
  const appearances = [];
  for (const date of dates) {
    const dayData = allData[date] || {};
    if (dayData.douyin && dayData.douyin.items) {
      const found = dayData.douyin.items.find(i => i.name === drama.name);
      if (found) appearances.push({ ...found, platform: '抖音', date });
    }
    if (dayData.hongguo && dayData.hongguo.items) {
      const found = dayData.hongguo.items.find(i => i.name === drama.name);
      if (found) appearances.push({ ...found, platform: '红果', date });
    }
  }

  html += `上榜记录：<span class="num">${appearances.length}</span> 次<br><br>`;

  for (const app of appearances) {
    html += `📅 ${app.date} | ${app.platform} #${app.rank}`;
    if (app.newPlay) html += ` | 新增 ${app.newPlay}`;
    if (app.hotValue) html += ` | 热度 ${app.hotValue}`;
    if (app.tags) html += ` | <span class="tag">${app.tags}</span>`;
    if (app.type && app.type !== '0') html += ` | <span class="tag">${app.type}</span>`;
    html += '<br>';
  }

  return { html, suggestions: ['排名变化', '题材分布', '跨平台对比'] };
}

init();
</script>
<script>
// 自动检测页面更新 —— 通过 GitHub API 获取最新 commit SHA，不受 CDN 缓存影响
(function() {
  var REPO_OWNER = 'bilinsandrali-cpu';
  var REPO_NAME = 'Sandra';
  var BRANCH = 'main';
  var CHECK_INTERVAL = 2000; // 首次检测延迟(ms)
  var STORAGE_KEY = 'last_known_commit_sha';

  // 防循环：如果刚刚刷新过，5 秒内不再检测
  var lastReload = sessionStorage.getItem('_last_reload_ts');
  if (lastReload && (Date.now() - parseInt(lastReload)) < 10000) {
    console.log('[auto-refresh] 最近刚刷新过，跳过检测');
    return;
  }

  setTimeout(async function() {
    try {
      // 通过 GitHub API 获取最新 commit SHA（此 API 不受 Pages CDN 缓存影响）
      var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/commits/' + BRANCH + '?_t=' + Date.now();
      var resp = await fetch(apiUrl, {
        headers: { 'Accept': 'application/vnd.github.v3.sha' },
        cache: 'no-store'
      });
      if (!resp.ok) {
        console.log('[auto-refresh] GitHub API 请求失败:', resp.status);
        return;
      }
      var latestSha = (await resp.text()).trim();
      var cachedSha = localStorage.getItem(STORAGE_KEY);

      console.log('[auto-refresh] 最新 commit:', latestSha.substring(0, 7), '| 缓存:', cachedSha ? cachedSha.substring(0, 7) : '无');

      if (!cachedSha) {
        // 第一次访问，记录当前 SHA，不刷新
        localStorage.setItem(STORAGE_KEY, latestSha);
        console.log('[auto-refresh] 首次记录 commit SHA');
        return;
      }

      if (cachedSha !== latestSha) {
        console.log('[auto-refresh] 检测到新版本！即将刷新...');
        localStorage.setItem(STORAGE_KEY, latestSha);
        sessionStorage.setItem('_last_reload_ts', Date.now().toString());
        // 硬刷新：利用 location.reload(true) 跳过浏览器缓存
        // 同时在 URL 加上版本参数，确保 CDN 也返回新内容
        var baseUrl = location.href.split('?')[0].split('#')[0];
        location.replace(baseUrl + '?v=' + latestSha.substring(0, 7));
      }
    } catch(e) {
      console.log('[auto-refresh] 检测失败:', e.message);
    }
  }, CHECK_INTERVAL);

  // 每 60 秒持续检测（用户保持页面打开时也能自动获取更新）
  setInterval(async function() {
    try {
      var lastReload2 = sessionStorage.getItem('_last_reload_ts');
      if (lastReload2 && (Date.now() - parseInt(lastReload2)) < 10000) return;

      var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/commits/' + BRANCH + '?_t=' + Date.now();
      var resp = await fetch(apiUrl, {
        headers: { 'Accept': 'application/vnd.github.v3.sha' },
        cache: 'no-store'
      });
      if (!resp.ok) return;
      var latestSha = (await resp.text()).trim();
      var cachedSha = localStorage.getItem(STORAGE_KEY);
      if (cachedSha && cachedSha !== latestSha) {
        console.log('[auto-refresh] 后台检测到新版本，即将刷新...');
        localStorage.setItem(STORAGE_KEY, latestSha);
        sessionStorage.setItem('_last_reload_ts', Date.now().toString());
        var baseUrl = location.href.split('?')[0].split('#')[0];
        location.replace(baseUrl + '?v=' + latestSha.substring(0, 7));
      }
    } catch(e) {}
  }, 60000);
})();

// 清理 URL 中的 v= 参数，保持地址栏干净
(function() {
  if (location.search.indexOf('v=') !== -1) {
    try {
      var cleanUrl = location.href.replace(/[?&]v=[^&]+/, '').replace(/\?$/, '');
      if (cleanUrl !== location.href) {
        history.replaceState(null, '', cleanUrl);
      }
    } catch(e) {}
  }
})();
</script>
